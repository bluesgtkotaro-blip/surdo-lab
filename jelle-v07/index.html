
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2018">
<title>JELLE v0.7 — TUNER Design</title>
<style>
:root{
  --ink:#0b1c16;
  --forest:#162d23;
  --brass:#c7a16b;
  --ivory:#f5e8c9;
  --metal:#c8b899;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  background:#07130e;
  color:var(--ivory);
  font-family:Georgia,"Hiragino Mincho ProN",serif;
}
button,select{font:inherit}
.app{
  position:relative;
  width:min(100%,430px);
  height:100dvh;
  min-height:560px;
  margin:auto;
  padding:env(safe-area-inset-top) 9px env(safe-area-inset-bottom);
  display:flex;
  flex-direction:column;
  gap:7px;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 85% 0%,#4a6245 0%,transparent 35%),
    linear-gradient(145deg,#23382a,#0d2018 65%,#1a2c21);
  box-shadow:0 0 40px #000a;
}
.masthead{
  position:relative;
  flex:0 0 auto;
  min-height:82px;
  padding:9px 12px 7px;
  background:
    radial-gradient(ellipse at 85% 0%,#627a4d66,transparent 60%),
    #c7b894;
  color:#14231b;
  border:1px solid #f2e2bd;
  border-bottom:3px solid #776040;
  overflow:hidden;
}
.masthead:after{
  content:"";
  position:absolute;
  right:8px;top:-20px;
  width:125px;height:120px;
  opacity:.25;
  transform:rotate(-25deg);
  background:
    repeating-linear-gradient(115deg,
      transparent 0 11px,#314b31 12px 14px,
      transparent 15px 23px);
  clip-path:ellipse(48% 48%);
  pointer-events:none;
}
.maker{font-size:9px;letter-spacing:.36em}
.brand{
  font-size:40px;
  line-height:1;
  letter-spacing:.19em;
  text-shadow:1px 1px #f9ebc9;
}
.subtitle{font-size:9px;letter-spacing:.22em;margin-top:2px}
.gear{
  position:absolute;right:13px;top:22px;
  width:37px;height:37px;border-radius:50%;
  display:grid;place-items:center;
  border:3px ridge #d6b77f;
  background:#12261d;color:#e2c99c;
  font-size:23px;z-index:1;
}
.tabs{
  flex:0 0 auto;
  display:grid;grid-template-columns:1fr 1fr;
  padding:4px;gap:4px;
  background:linear-gradient(#6b614b,#352f24);
  border:1px solid #bda174;border-radius:8px;
}
.tabs button{
  height:40px;
  border:1px solid #b69b6e;border-radius:5px;
  background:linear-gradient(#21372c,#0b1b15);
  color:#e9d9b8;
  font-size:15px;letter-spacing:.06em;
}
.tabs .selected{
  background:linear-gradient(#f3e3bf,#c7a46d);
  color:#14231b;font-weight:bold;
}
.metal{
  position:relative;
  flex:0 0 auto;
  padding:8px;
  border:2px solid #514633;
  border-radius:10px;
  background:
    repeating-linear-gradient(100deg,
      #b7a88c 0px,#c5b598 3px,
      #a99a80 6px,#b7a88c 9px);
  box-shadow:
    inset 0 2px #f1e0b8,
    inset 0 -3px #74634a,
    0 3px 9px #0008;
}
.metal:before,.metal:after{
  content:"⊕";
  position:absolute;top:3px;
  color:#51402b;
  font:13px sans-serif;
  text-shadow:1px 1px #e7d4a9;
}
.metal:before{left:4px}
.metal:after{right:4px}
.instrument{
  display:grid;
  grid-template-columns:105px 1fr;
  align-items:center;
  gap:5px;
  color:#1b241b;
  padding:2px 4px;
}
.instrument label{font-size:11px;letter-spacing:.04em}
.instrument select{
  min-width:0;width:100%;height:39px;
  background:#10261c;color:#f5e9ca;
  border:2px inset #756348;
  border-radius:5px;
  padding:0 9px;
  font-size:13px;
}
.measure{
  flex:1 1 0;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 96px;
  gap:6px;
}
.glass{
  min-width:0;min-height:0;
  background:
    radial-gradient(ellipse at 50% 25%,#213c2c,#07140f 85%);
  border:3px ridge #9b7c4e;
  border-radius:7px;
  box-shadow:inset 0 3px 13px #000d;
}
.frequency{
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:12px 7px 9px;
  text-align:center;
}
.panel-label{
  color:#ead8b3;
  font-size:12px;letter-spacing:.12em;
}
.number-line{
  display:flex;
  align-items:baseline;
  justify-content:center;
  white-space:nowrap;
  font-family:"Arial Narrow",Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  font-weight:300;
  color:#fff4d8;
  text-shadow:0 0 13px #e5c98a55;
}
.number{
  font-size:clamp(66px,20vw,91px);
  letter-spacing:-.075em;
  line-height:1.05;
}
.unit{font-size:18px;margin-left:7px}
.leds{
  display:flex;
  justify-content:space-evenly;
  gap:8px;
  margin-top:4px;
}
.led{
  width:28px;height:28px;
  border-radius:50%;
  border:3px ridge #aa956b;
  background:radial-gradient(circle at 35% 30%,#263129,#080d0b);
  box-shadow:inset 0 2px 5px #000c;
}
.led.green{
  background:radial-gradient(circle at 35% 30%,#ddffb0,#419f42 48%,#17441d);
  box-shadow:0 0 12px #8ddd67,inset 0 2px 3px #fff8;
}
.led.amber{
  background:radial-gradient(circle at 35% 30%,#fff0a5,#dc8e16 48%,#653609);
  box-shadow:0 0 12px #f4b54c,inset 0 2px 3px #fff8;
}
.state{
  font-size:10px;
  letter-spacing:.06em;
  color:#ead4a5;
  white-space:nowrap;
}
.reel{
  position:relative;
  display:grid;
  grid-template-rows:1fr 1.2fr 1fr;
  overflow:hidden;
  text-align:center;
  font-family:Arial,sans-serif;
}
.reel .note{
  display:grid;place-items:center;
  color:#d5c6a4;
  font-size:24px;
  border-bottom:1px solid #8d744a;
}
.reel .note:first-child{opacity:.45}
.reel .note:last-child{opacity:.45;border:0}
.reel .current{
  background:linear-gradient(#f9e8bd,#cda769);
  color:#17231a;
  font-size:31px;font-weight:bold;
  text-shadow:1px 1px #fff7;
  border-top:2px solid #b68b50;
  border-bottom:2px solid #806039;
}
.reel:after{
  content:"";
  position:absolute;right:0;top:50%;
  width:13px;height:3px;
  background:#f9bd4c;
  box-shadow:0 0 8px #ffae34;
}
.spectrum-panel{
  flex:0 0 auto;
  height:clamp(135px,22dvh,190px);
}
.spectrum-glass{
  height:100%;padding:8px;
  display:flex;flex-direction:column;
}
.spectrum-glass .panel-label{flex:0 0 auto}
#spectrum{
  width:100%;height:100%;
  min-height:0;display:block;
}
.bottom-panel{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:10px;
  min-height:122px;
  padding:10px 18px;
}
.control{text-align:center}
.control button{
  width:76px;height:76px;
  border-radius:50%;
  border:6px ridge #c6a978;
  color:#f8e8c7;
  font-size:29px;
  background:
    radial-gradient(circle at 35% 25%,#475849,#081610 70%);
  box-shadow:0 3px 9px #0009;
}
.control .mic{
  background:
    radial-gradient(circle at 35% 25%,#8cda78,#1f6c32 65%,#0a2517);
  box-shadow:0 0 10px #7dc76b77,0 3px 9px #0009;
}
.control .caption{
  color:#1c261c;
  font:12px Arial,sans-serif;
  margin-top:5px;
  letter-spacing:.06em;
}
.foot{
  flex:0 0 auto;
  text-align:center;
  font-size:8px;
  letter-spacing:.2em;
  color:#bba67e;
  padding:2px 0 5px;
}
.demo-tag{
  position:absolute;bottom:4px;right:6px;
  font:8px Arial,sans-serif;
  color:#5d503b;
}
@media(max-height:740px){
  .masthead{min-height:67px;padding-top:5px}
  .brand{font-size:32px}
  .gear{top:13px}
  .tabs button{height:35px}
  .spectrum-panel{height:125px}
  .bottom-panel{min-height:100px;padding:5px 15px}
  .control button{width:64px;height:64px}
  .number{font-size:clamp(60px,18vw,78px)}
  .led{width:23px;height:23px}
}
@media(max-width:365px){
  .measure{grid-template-columns:minmax(0,1fr) 77px}
  .number{font-size:64px}
  .unit{font-size:14px}
  .reel .current{font-size:25px}
  .reel .note{font-size:20px}
}
</style>
</head>
<body>
<main class="app">
<header class="masthead">
  <div class="maker">KOTARO H.</div>
  <div class="brand">JELLE</div>
  <div class="subtitle">SURDO TUNER</div>
  <div class="gear">⚙</div>
</header>

<nav class="tabs" aria-label="モード">
  <button class="selected">TUNER</button>
  <button disabled>RECORDER</button>
</nav>

<section class="metal">
  <div class="instrument">
    <label for="instrument">INSTRUMENT</label>
    <select id="instrument">
      <option>SURDO / PRIMEIRA</option>
      <option>SURDO / SEGUNDA</option>
      <option>SURDO / TERCEIRA</option>
      <option>PANDEIRO</option>
    </select>
  </div>
</section>

<section class="metal measure">
  <div class="glass frequency">
    <div class="panel-label">FREQUENCY</div>
    <div class="number-line">
      <span class="number">82.4</span>
      <span class="unit">Hz</span>
    </div>
    <div class="leds">
      <div class="led green"></div>
      <div class="led amber"></div>
      <div class="led"></div>
    </div>
    <div class="state">STANDBY / MEASURING</div>
  </div>
  <div class="glass reel">
    <div class="note">F2</div>
    <div class="note current">E2</div>
    <div class="note">D♯2</div>
  </div>
  <span class="demo-tag">DISPLAY TEST</span>
</section>

<section class="metal spectrum-panel">
  <div class="glass spectrum-glass">
    <div class="panel-label">SPECTRUM</div>
    <canvas id="spectrum"></canvas>
  </div>
</section>

<section class="metal bottom-panel">
  <div class="control">
    <button class="mic" disabled aria-label="MIC">♩</button>
    <div class="caption">MIC ON</div>
  </div>
  <div class="control">
    <button disabled aria-label="LOCK">♙</button>
    <div class="caption">LOCK</div>
  </div>
</section>

<div class="foot">FIELD INSTRUMENTS — JELLE</div>
</main>

<script>
(function(){
  const canvas=document.getElementById('spectrum');
  function draw(){
    const rect=canvas.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    const w=rect.width,h=rect.height;
    if(w<1||h<1)return;
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(h*dpr);
    const g=canvas.getContext('2d');
    g.scale(dpr,dpr);
    g.clearRect(0,0,w,h);
    g.strokeStyle='#345242';
    g.lineWidth=.6;
    for(let i=1;i<6;i++){
      let y=i*h/6;
      g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();
    }
    for(let i=1;i<8;i++){
      let x=i*w/8;
      g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();
    }
    const f=x=>20+480*x/w;
    const peak=(x,c,s,a)=>a*Math.exp(-.5*((x-c)/s)**2);
    g.beginPath();
    g.lineWidth=1.7;
    g.strokeStyle='#f3d291';
    g.shadowColor='#f1c66d';
    g.shadowBlur=6;
    for(let x=0;x<w;x++){
      const hz=f(x);
      const v=
        peak(hz,102,23,.88)+
        peak(hz,240,19,.18)+
        peak(hz,370,15,.35)+
        .025*Math.abs(Math.sin(x*.53)*Math.cos(x*.19));
      const y=h-17-v*(h-28);
      if(x===0)g.moveTo(x,y);else g.lineTo(x,y);
    }
    g.stroke();
    g.shadowBlur=0;
    g.fillStyle='#ddc79e';
    g.font='10px Georgia';
    for(const hz of [20,50,100,200,500]){
      const x=(hz-20)/480*w;
      g.fillText(String(hz),Math.min(w-23,Math.max(0,x)),h-3);
    }
  }
  window.addEventListener('resize',draw);
  draw();
})();
</script>
</body>
</html>
