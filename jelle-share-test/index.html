
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JELLE Recorder Test</title>
<style>
body{margin:0;background:#12271f;color:#eee2bf;font-family:sans-serif}
main{max-width:480px;margin:auto;padding:24px 16px}
h1{font:42px Georgia,serif;letter-spacing:.15em}
section{background:#1c332b;border:1px solid #967e52;border-radius:8px;padding:16px;margin:16px 0}
button,select{padding:12px;font-size:16px;margin:5px 0}
button{background:#d9bd82;border:0;border-radius:5px}
button:disabled{opacity:.4}
#rec{background:#ad3d37;color:white}
audio{width:100%}
#timer{font-size:42px;text-align:center}
</style>
</head>
<body>
<main>
<small>KOTARO H. / SURDO LAB</small>
<h1>JELLE</h1>
<p>RECORDER / SHARE TEST</p>

<section>
<h3>1. 録音</h3>
<select id="instrument">
<option value="primeira">SURDO / PRIMEIRA</option>
<option value="segunda">SURDO / SEGUNDA</option>
<option value="terceira">SURDO / TERCEIRA</option>
<option value="pandeiro">PANDEIRO</option>
</select>
<select id="mode">
<option value="normal">通常打撃</option>
<option value="soft">弱打</option>
<option value="strong">強打</option>
<option value="roll">連打</option>
</select>
<div id="timer">00:00</div>
<button id="rec">● REC</button>
<button id="stop" disabled>■ STOP</button>
<p id="status">待機中</p>
</section>

<section>
<h3>2. 再生</h3>
<audio id="player" controls></audio>
</section>

<section>
<h3>3. Google Driveへ送る</h3>
<p>録音を確認してから送信してください。</p>
<label>
<input type="checkbox" id="consent">
送信に同意する
</label>
<p><button id="share" disabled>SEND / 共有する</button></p>
<button id="download" disabled>ファイルを保存</button>
<p>共有先は自分で選択してください。自動送信はしません。</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let stream,recorder,chunks=[],file,url,start,timer;
const status=t=>$('status').textContent=t;
function update(){
  $('share').disabled=!file||!$('consent').checked;
  $('download').disabled=!file;
}
$('consent').onchange=update;

$('rec').onclick=async()=>{
 try{
  if(!window.MediaRecorder)throw Error('録音非対応です');
  stream=await navigator.mediaDevices.getUserMedia({
   audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}
  });
  const mime=['audio/mp4','audio/webm'].find(
   x=>MediaRecorder.isTypeSupported(x)
  );
  recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
  chunks=[];file=null;
  $('consent').checked=false;update();
  recorder.ondataavailable=e=>{
   if(e.data.size)chunks.push(e.data);
  };
  recorder.onstop=()=>{
   clearInterval(timer);
   stream.getTracks().forEach(t=>t.stop());
   const blob=new Blob(chunks,{type:recorder.mimeType});
   if(!blob.size){status('録音が空です');return;}
   const ext=blob.type.includes('mp4')?'m4a':'webm';
   const name='JELLE_'+$('instrument').value+'_'
    +$('mode').value+'_'+Date.now()+'.'+ext;
   file=new File([blob],name,{type:blob.type});
   if(url)URL.revokeObjectURL(url);
   url=URL.createObjectURL(file);
   $('player').src=url;
   status('録音完了。再生して確認してください');
   update();
  };
  recorder.start(1000);
  start=Date.now();
  $('rec').disabled=true;
  $('stop').disabled=false;
  status('録音中');
  timer=setInterval(()=>{
   const s=Math.floor((Date.now()-start)/1000);
   $('timer').textContent=
    String(Math.floor(s/60)).padStart(2,'0')+':'
    +String(s%60).padStart(2,'0');
  },250);
 }catch(e){status('開始失敗: '+e.message);}
};
$('stop').onclick=()=>{
 if(recorder?.state==='recording'){
  recorder.stop();
  $('rec').disabled=false;
  $('stop').disabled=true;
 }
};
$('share').onclick=async()=>{
 if(!file||!$('consent').checked)return;
 try{
  if(!navigator.canShare?.({files:[file]}))
   throw Error('ファイル共有非対応');
  await navigator.share({files:[file],title:'JELLE録音'});
  status('Google Driveに保存されたか確認してください');
 }catch(e){status('共有: '+e.message);}
};
$('download').onclick=()=>{
 if(!file)return;
 const a=document.createElement('a');
 a.href=url;a.download=file.name;
 document.body.appendChild(a);a.click();a.remove();
};
</script>
</body>
</html>
