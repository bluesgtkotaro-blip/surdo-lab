
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JELLE Acoustic Analysis Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10251e;color:#eee4c8;font-family:system-ui,sans-serif}
main{max-width:850px;margin:auto;padding:24px 16px 60px}
header{border-bottom:1px solid #9b8256;padding-bottom:15px}
h1{font:44px Georgia,serif;letter-spacing:.16em;margin:6px 0}
small{color:#bbaa82;letter-spacing:.12em}
section{background:#1b3229;border:1px solid #86734e;border-radius:8px;padding:16px;margin:18px 0}
h2{font-size:18px;margin:0 0 14px}
input[type=file]{width:100%;padding:12px;border:1px dashed #a88e61;color:#eee4c8}
audio{width:100%;margin-top:12px}
canvas{display:block;width:100%;height:200px;background:#0b1b17;border:1px solid #58634b;border-radius:5px}
label{display:block;margin:12px 0 5px}
input[type=range]{width:100%}
button{background:#d5b980;color:#19271e;border:0;border-radius:5px;padding:11px 16px;font-weight:bold;font-size:15px}
button:disabled{opacity:.45}
#results{font-size:17px;line-height:1.8}
#status{color:#f4d58b;line-height:1.6}
.note{font-size:13px;color:#c7bd9e;line-height:1.7}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
strong{color:#f3d58e}
</style>
</head>
<body>
<main>
<header>
<small>KOTARO H. / SURDO LAB</small>
<h1>JELLE</h1>
<small>ACOUSTIC ANALYZER · TEST 01</small>
</header>

<section>
<h2>1. 録音ファイルを選ぶ</h2>
<input id="file" type="file" accept="audio/*,.m4a,.mp4,.wav,.webm,.mp3">
<audio id="player" controls></audio>
<p id="status">録音ファイルを選択してください。外部送信されません。</p>
</section>

<section>
<h2>2. 波形 / WAVEFORM</h2>
<canvas id="wave"></canvas>
<label for="position">
解析位置：<output id="positionLabel">0.00 秒</output>
</label>
<input id="position" type="range" min="0" max="1000" value="0" disabled>
<p class="note">スライダーで打撃音の位置を選んでください。</p>
</section>

<section>
<h2>3. 周波数スペクトル / SPECTRUM</h2>
<div class="controls">
<label for="range">表示範囲</label>
<select id="range">
<option value="500">0–500 Hz</option>
<option value="1000">0–1000 Hz</option>
<option value="2000">0–2000 Hz</option>
<option value="5000">0–5000 Hz</option>
</select>
<button id="analyze" disabled>解析する</button>
</div>
<canvas id="spectrum"></canvas>
<p id="results">解析結果はここに表示されます。</p>
<p class="note">
最大ピークは必ずしも基音ではありません。
打撃直後と減衰中では結果が変わることがあります。
</p>
</section>
<p class="note">
JELLE RESEARCH TEST / 解析はブラウザ内で実行されます。
</p>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id);
let ctx=null,buffer=null,objectUrl=null;
const N=8192;

function prepareCanvas(id){
 const c=$(id);
 const r=c.getBoundingClientRect();
 const scale=window.devicePixelRatio||1;
 c.width=Math.max(1,Math.round(r.width*scale));
 c.height=Math.max(1,Math.round(r.height*scale));
 const g=c.getContext('2d');
 g.setTransform(scale,0,0,scale,0,0);
 return {g,w:r.width,h:r.height};
}

function base(g,w,h){
 g.fillStyle='#0b1b17';
 g.fillRect(0,0,w,h);
 g.strokeStyle='#34483d';
 for(let i=1;i<5;i++){
  let y=i*h/5;
  g.beginPath();
  g.moveTo(0,y);
  g.lineTo(w,y);
  g.stroke();
 }
}

function drawWave(){
 if(!buffer)return;
 const {g,w,h}=prepareCanvas('wave');
 base(g,w,h);
 const x=buffer.getChannelData(0);
 const step=Math.max(1,Math.ceil(x.length/w));
 g.strokeStyle='#d9bd82';
 g.lineWidth=1;
 g.beginPath();
 for(let i=0;i<Math.ceil(w);i++){
  let lo=1,hi=-1;
  const start=i*step;
  for(let j=start;j<Math.min(start+step,x.length);j++){
   if(x[j]<lo)lo=x[j];
   if(x[j]>hi)hi=x[j];
  }
  g.moveTo(i+.5,(1-hi)*h/2);
  g.lineTo(i+.5,(1-lo)*h/2);
 }
 g.stroke();
 const pos=Number($('position').value)/1000;
 g.strokeStyle='#e97d66';
 g.lineWidth=2;
 g.beginPath();
 g.moveTo(pos*w,0);
 g.lineTo(pos*w,h);
 g.stroke();
}

function fft(real,imag){
 const n=real.length;
 for(let i=1,j=0;i<n;i++){
  let bit=n>>1;
  for(;j&bit;bit>>=1)j^=bit;
  j^=bit;
  if(i<j){
   [real[i],real[j]]=[real[j],real[i]];
   [imag[i],imag[j]]=[imag[j],imag[i]];
  }
 }
 for(let len=2;len<=n;len<<=1){
  const ang=-2*Math.PI/len;
  for(let i=0;i<n;i+=len){
   for(let j=0;j<len/2;j++){
    const a=ang*j;
    const cos=Math.cos(a),sin=Math.sin(a);
    const p=i+j,q=p+len/2;
    const tr=real[q]*cos-imag[q]*sin;
    const ti=real[q]*sin+imag[q]*cos;
    real[q]=real[p]-tr;
    imag[q]=imag[p]-ti;
    real[p]+=tr;
    imag[p]+=ti;
   }
  }
 }
}

function analyze(){
 if(!buffer)return;
 const data=buffer.getChannelData(0);
 const rate=buffer.sampleRate;
 const start=Math.min(
  Math.floor(Number($('position').value)/1000*buffer.duration*rate),
  Math.max(0,data.length-N)
 );
 const re=new Float64Array(N);
 const im=new Float64Array(N);
 let power=0;

 for(let i=0;i<N;i++){
  const v=data[start+i]||0;
  power+=v*v;
  re[i]=v*(.5-.5*Math.cos(2*Math.PI*i/(N-1)));
 }
 if(power/N<1e-9){
  $('results').textContent='ほぼ無音です。打撃音の位置を選んでください。';
  return;
 }
 fft(re,im);

 const maxHz=Number($('range').value);
 const maxBin=Math.min(Math.floor(maxHz*N/rate),N/2-1);
 const mag=new Float64Array(maxBin+1);
 let best=0,bestBin=0;

 for(let i=1;i<=maxBin;i++){
  mag[i]=Math.hypot(re[i],im[i]);
  if(mag[i]>best){
   best=mag[i];
   bestBin=i;
  }
 }

 const {g,w,h}=prepareCanvas('spectrum');
 base(g,w,h);
 const left=38,right=10,top=10,bottom=26;
 const plotW=w-left-right;
 const plotH=h-top-bottom;
 g.strokeStyle='#d9bd82';
 g.lineWidth=1.5;
 g.beginPath();

 for(let i=0;i<=maxBin;i++){
  const x=left+i/maxBin*plotW;
  const y=top+plotH*(1-Math.max(0,mag[i]/best));
  if(i===0)g.moveTo(x,y);
  else g.lineTo(x,y);
 }
 g.stroke();

 g.fillStyle='#c6b996';
 g.font='11px system-ui';
 for(let hz=0;hz<=maxHz;hz+=maxHz/5){
  const x=left+hz/maxHz*plotW;
  g.fillText(Math.round(hz)+'',Math.max(2,x-10),h-8);
 }
 g.fillText('Hz',w-23,h-8);

 let freq=bestBin*rate/N;
 if(bestBin>1&&bestBin<maxBin){
  const a=Math.log(mag[bestBin-1]);
  const b=Math.log(mag[bestBin]);
  const c=Math.log(mag[bestBin+1]);
  const denom=a-2*b+c;
  if(Number.isFinite(denom)&&Math.abs(denom)>1e-12){
   const delta=Math.max(-.5,Math.min(.5,.5*(a-c)/denom));
   freq=(bestBin+delta)*rate/N;
  }
 }

 const px=left+freq/maxHz*plotW;
 g.strokeStyle='#e97d66';
 g.beginPath();
 g.moveTo(px,top);
 g.lineTo(px,top+plotH);
 g.stroke();

 $('results').innerHTML=
  '最大ピーク: <strong>'+freq.toFixed(1)+' Hz</strong><br>'+
  '解析位置: '+(start/rate).toFixed(2)+' 秒<br>'+
  'サンプリング周波数: '+rate+' Hz<br>'+
  'FFT: '+N+' 点 / 周波数間隔: '+(rate/N).toFixed(2)+' Hz';
}

$('file').onchange=async e=>{
 const f=e.target.files[0];
 if(!f)return;
 $('status').textContent='読み込み中…';
 $('analyze').disabled=true;
 try{
  if(objectUrl)URL.revokeObjectURL(objectUrl);
  objectUrl=URL.createObjectURL(f);
  $('player').src=objectUrl;
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  const ab=await f.arrayBuffer();
  buffer=await ctx.decodeAudioData(ab);
  $('position').disabled=false;
  $('position').value=0;
  $('positionLabel').textContent='0.00 秒';
  $('analyze').disabled=false;
  $('status').textContent=
   '読み込み成功: '+f.name+' / '+buffer.duration.toFixed(2)+' 秒';
  drawWave();
  analyze();
 }catch(err){
  buffer=null;
  $('status').textContent='読み込み失敗: '+err.message;
 }
};

$('position').oninput=()=>{
 if(!buffer)return;
 $('positionLabel').textContent=
  (Number($('position').value)/1000*buffer.duration).toFixed(2)+' 秒';
 drawWave();
 analyze();
};
$('range').onchange=analyze;
$('analyze').onclick=analyze;
window.addEventListener('resize',()=>{
 if(buffer){drawWave();analyze();}
});
</script>
</body>
</html>
