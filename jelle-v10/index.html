function drawNumber(f){let svg=$('digits');svg.replaceChildren();let s=Number.isFinite(f)?f.toFixed(1):'---.-',x=0;
 for(let c of s){if(c==='.'){svg.appendChild(el('circle',{cx:x+6,cy:126,r:5,fill:'#e4d4b0'}));x+=17;continue}
 let group=el('g',{transform:`translate(${x},4)`});svg.appendChild(group);
 for(let k in polys){let active=masks[c]?.includes(k);group.appendChild(el('polygon',{points:polys[k],fill:active?'#e8d8b5':'#36362c33',stroke:active?'#f3e5c7':'none','stroke-width':'.4'}))}x+=71}

function spectrum(){let c=$('graph'),r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));let g=c.getContext('2d');g.scale(d,d);let w=r.width,h=r.height;
 g.fillStyle='#081b14';g.fillRect(0,0,w,h);g.strokeStyle='#294537';g.lineWidth=.7;
 for(let i=1;i<6;i++){g.beginPath();g.moveTo(0,i*h/6);g.lineTo(w,i*h/6);g.stroke()}
 for(let i=1;i<9;i++){g.beginPath();g.moveTo(i*w/9,0);g.lineTo(i*w/9,h);g.stroke()}
 g.beginPath();g.strokeStyle='#e8bc71';g.lineWidth=1.6;g.shadowColor='#cba058';g.shadowBlur=4;
 for(let x=0;x<w;x++){let f=20+480*x/w, v=0;
 if(analyser){let idx=Math.round(f*analyser.fftSize/ctx.sampleRate);v=Math.max(0,((buf?.[idx]??-110)+105)/85)}
 else if(Number.isFinite(frequency)){v=.8*Math.exp(-.5*((f-frequency*1.2)/19)**2)+.24*Math.exp(-.5*((f-frequency*3.4)/18)**2)}
 let y=h-3-Math.min(1,v)*(h-7);if(!x)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke();g.shadowBlur=0;}
function estimate(){if(!analyser||!ctx)return NaN;let n=analyser.fftSize;let time=new Float32Array(n);analyser.getFloatTimeDomainData(time);
 let rms=Math.sqrt(time.reduce((s,v)=>s+v*v,0)/n);if(rms<.008)return NaN;
 // Normalized difference of adjacent delayed samples, for fundamental estimation.
 let rate=ctx.sampleRate,minLag=Math.floor(rate/350),maxLag=Math.min(Math.floor(rate/35),n/2-1),best=0,bestScore=0;
 for(let lag=minLag;lag<=maxLag;lag+=2){let sum=0,a=0,b=0;for(let i=0;i<n-lag;i+=4){let v=time[i],w=time[i+lag];sum+=v*w;a+=v*v;b+=w*w}let score=sum/Math.sqrt(a*b+1e-12);
 if(score>bestScore){bestScore=score;best=lag}}
 if(bestScore<.55||!best)return NaN;
 // refine lag in one-sample steps
 let lagBest=best,scoreBest=-1;for(let lag=Math.max(minLag,best-3);lag<=Math.min(maxLag,best+3);lag++){
 let sum=0,a=0,b=0;for(let i=0;i<n-lag;i+=4){let v=time[i],w=time[i+lag];sum+=v*w;a+=v*v;b+=w*w}let score=sum/Math.sqrt(a*b+1e-12);if(score>scoreBest){scoreBest=score;lagBest=lag}}
 return rate/lagBest;}
function tick(t){if(!analyser)return;analyser.getFloatFrequencyData(buf);if(t-last>140){if(!locked){let f=estimate();update(f);$('state').textContent=Number.isFinite(f)?'MEASURING':'LISTENING…'}last=t} spectrum();raf=requestAnimationFrame(tick)}
async function start(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPSまたはSafariで開いてください');
 stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
 ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();let src=ctx.createMediaStreamSource(stream);
 analyser=ctx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=.65;src.connect(analyser);buf=new Float32Array(analyser.frequencyBinCount);
 $('state').textContent='LISTENING…';$('info').textContent='マイク測定中。LOCKで表示を固定できます。';raf=requestAnimationFrame(tick);
 }catch(e){$('info').textContent='マイク開始に失敗: '+e.message;await stop()}}
async function stop(){cancelAnimationFrame(raf);raf=0;analyser=null;buf=null;stream?.getTracks().forEach(t=>t.stop());stream=null;if(ctx){await ctx.close().catch(()=>{});ctx=null}$('state').textContent='MIC OFF';spectrum()}
$('mic').onclick=()=>stream?stop():start();$('off').onclick=stop;
$('lock').onclick=()=>{locked=!locked;$('state').textContent=locked?'LOCKED':stream?'MEASURING':'MIC OFF'};
$('test').onclick=()=>{if(!locked){update(82.4);spectrum();$('state').textContent='DISPLAY TEST'}};
window.addEventListener('resize',spectrum);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});update(NaN);spectrum();
</script></body></html>
